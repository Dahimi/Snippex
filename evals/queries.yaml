# Eval query set — 60 diverse queries across 8 categories
# Each query is designed to reflect real-world usage of the search API.
#
# Categories:
#   news          — breaking/recent events, time-sensitive
#   finance       — markets, companies, economic indicators
#   tech          — products, tools, software, engineering
#   science       — research, health, environment
#   how_to        — instructional, step-based queries
#   facts         — specific, verifiable, historical
#   ambiguous     — unclear intent or multiple valid answers
#   multi_part    — compound questions requiring several answers

queries:

  # ── NEWS ──────────────────────────────────────────────────────────────────
